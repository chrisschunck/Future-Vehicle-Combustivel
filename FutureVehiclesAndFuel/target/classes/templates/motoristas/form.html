<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Novo Motorista')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container" style="max-width: 600px;">
    <h2 class="mb-4">Cadastrar Motorista</h2>
    <div th:replace="~{fragments :: mensagens}"></div>
    <form th:action="@{/motoristas}" th:object="${motoristaFormData}" method="post" class="card p-4">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">CNH</label>
            <input type="text" class="form-control" th:field="*{cnh}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Validade da CNH</label>
            <input type="date" class="form-control" th:field="*{validadeCnh}" required/>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/motoristas}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
