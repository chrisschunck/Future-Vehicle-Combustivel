<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Registrar Abastecimento')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container" style="max-width: 600px;">
    <h2 class="mb-4">Registrar Abastecimento / Recarga</h2>
    <div th:replace="~{fragments :: mensagens}"></div>
    <form th:action="@{/abastecimentos}" th:object="${abastecimentoFormData}" method="post" class="card p-4">
        <div class="mb-3">
            <label class="form-label">Veiculo</label>
            <select class="form-select" th:field="*{veiculoId}" required>
                <option value="">Selecione...</option>
                <option th:each="v : ${veiculos}" th:value="${v.id}" th:text="${v.placa} + ' - ' + ${v.modelo}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Quantidade (kWh ou kg de H2)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{quantidade}" required/>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Custo (R$)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{custo}"/>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Local / Eletroposto</label>
                <input type="text" class="form-control" th:field="*{localEletroposto}"/>
            </div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Registrar</button>
            <a th:href="@{/abastecimentos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
