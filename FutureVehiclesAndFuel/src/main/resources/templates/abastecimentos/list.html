<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Abastecimentos')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Abastecimentos / Recargas</h2>
        <a th:href="@{/abastecimentos/novo}" class="btn btn-primary">+ Registrar</a>
    </div>
    <div th:replace="~{fragments :: mensagens}"></div>
    <div class="card p-3">
        <table class="table table-hover align-middle mb-0">
            <thead><tr><th>Veiculo</th><th>Data/Hora</th><th>Quantidade</th><th>Custo</th><th>Local</th></tr></thead>
            <tbody>
            <tr th:each="a : ${abastecimentos}">
                <td th:text="${a.veiculoPlaca}"></td>
                <td th:text="${a.abastecimento.dataHora}"></td>
                <td th:text="${a.abastecimento.quantidade}"></td>
                <td th:text="${a.abastecimento.custo} ?: '-'"></td>
                <td th:text="${a.abastecimento.localEletroposto} ?: '-'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(abastecimentos)}">
                <td colspan="5" class="text-center text-muted py-4">Nenhum abastecimento registrado ainda.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
