<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="nav">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">🚗 Frota Control</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/veiculos}">Veiculos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/motoristas}">Motoristas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/alocacoes}">Alocacoes</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/manutencoes}">Manutencoes</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/abastecimentos}">Abastecimentos</a></li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<div th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <title th:text="${titulo} + ' - Frota Control'">Frota Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</div>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

<div th:fragment="mensagens">
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
</div>
</body>
</html>
