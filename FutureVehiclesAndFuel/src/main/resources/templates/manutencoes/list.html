<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manutencoes')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Manutencoes</h2>
        <a th:href="@{/manutencoes/nova}" class="btn btn-primary">+ Registrar Manutencao</a>
    </div>
    <div th:replace="~{fragments :: mensagens}"></div>
    <div class="card p-3">
        <table class="table table-hover align-middle mb-0">
            <thead><tr><th>Veiculo</th><th>Tipo</th><th>Km realizada</th><th>Data</th><th>Proxima em (km)</th><th>Custo</th></tr></thead>
            <tbody>
            <tr th:each="m : ${manutencoes}">
                <td th:text="${m.veiculoPlaca}"></td>
                <td th:text="${m.manutencao.tipo}"></td>
                <td th:text="${m.manutencao.quilometragemRealizada}"></td>
                <td th:text="${m.manutencao.dataRealizada}"></td>
                <td th:text="${m.manutencao.intervaloProximaKm} ?: '-'"></td>
                <td th:text="${m.manutencao.custo} ?: '-'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(manutencoes)}">
                <td colspan="6" class="text-center text-muted py-4">Nenhuma manutencao registrada ainda.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
