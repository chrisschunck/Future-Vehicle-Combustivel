<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nova Alocacao')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container" style="max-width: 600px;">
    <h2 class="mb-4">Nova Alocacao</h2>
    <div th:replace="~{fragments :: mensagens}"></div>
    <form th:action="@{/alocacoes}" th:object="${alocacaoFormData}" method="post" class="card p-4">
        <div class="mb-3">
            <label class="form-label">Veiculo disponivel</label>
            <select class="form-select" th:field="*{veiculoId}" required>
                <option value="">Selecione...</option>
                <option th:each="v : ${veiculosDisponiveis}" th:value="${v.id}"
                        th:text="${v.placa} + ' - ' + ${v.modelo}"></option>
            </select>
            <div class="form-text" th:if="${#lists.isEmpty(veiculosDisponiveis)}">
                Nenhum veiculo disponivel no momento.
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Motorista</label>
            <select class="form-select" th:field="*{motoristaId}" required>
                <option value="">Selecione...</option>
                <option th:each="m : ${motoristas}" th:value="${m.id}" th:text="${m.nome}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Km inicial</label>
            <input type="number" class="form-control" th:field="*{kmInicial}" min="0"/>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Alocar</button>
            <a th:href="@{/alocacoes}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
